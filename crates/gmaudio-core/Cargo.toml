[package]
name = "gmaudio-core"
version = "0.1.0"
edition = "2024"
description = "GMAudio library and audio engine (no UI dependencies)"

[dependencies]
ebur128 = "0.1.11"
fastrand = "2"
kira = { version = "0.12.6", default-features = false, features = [
    "cpal",
    "cpal-realtime",
    "symphonia",
    "mp3",
    "ogg",
    "vorbis",
    "flac",
    "wav",
    "pcm",
] }
notify = "8.2.2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm"] }
thiserror = "2"
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
