[package]
name = "gmaudio-core"
version = "0.1.0"
edition = "2024"
description = "GMAudio library and audio engine (no UI dependencies)"

[dependencies]
ebur128 = "0.1.11"
fastrand = "2"
kira = { version = "0.12.6", default-features = false, features = [
    "cpal",
    "cpal-realtime",
    "symphonia",
    "mp3",
    "ogg",
    "vorbis",
    "flac",
    "wav",
    "pcm",
    "aac",
    "isomp4",
] }
notify = "8.2.2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aac", "isomp4"] }
thiserror = "2"
ureq = { version = "2", features = ["json"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

# The Freesound key and sign-in are kept in the operating system's own
# credential store (Windows Credential Manager).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
