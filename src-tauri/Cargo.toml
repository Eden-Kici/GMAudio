[package]
name = "gmaudio"
version = "0.9.4"
description = "Audio control center for running tabletop RPG sessions"
authors = ["Eden Kici"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows).
name = "gmaudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gmaudio-core = { path = "../crates/gmaudio-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
