# Builds the installers for Windows and Linux and attaches them to a
# GitHub release. Runs whenever the version number changes on main, or by
# hand from the Actions tab ("Run workflow").
name: Build app

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            files: target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundles: deb,appimage
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: GMAudio-${{ steps.version.outputs.version }}-${{ runner.os }}
          path: ${{ matrix.files }}
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: GMAudio ${{ steps.version.outputs.version }}
          files: ${{ matrix.files }}
