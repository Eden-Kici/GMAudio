# Builds the Windows installer and attaches it to a GitHub release.
# Runs when a version tag (v0.9.3, ...) is pushed, or by hand from the
# Actions tab ("Run workflow").
name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - run: npm run tauri build
      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: GMAudio-${{ steps.version.outputs.version }}-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/gmaudio.exe
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: GMAudio ${{ steps.version.outputs.version }}
          files: target/release/bundle/nsis/*.exe
